services:
  - type: web
    name: buildmode
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: buildmode-db
          property: connectionString

databases:
  - name: buildmode-db
    plan: basic-256mb
    databaseName: buildmode
    user: buildmode
