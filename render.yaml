services:
  - type: web
    name: buildmode
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: buildmode-db
          property: connectionString

databases:
  - name: buildmode-db
    plan: basic-256mb
    databaseName: buildmode
    user: buildmode
